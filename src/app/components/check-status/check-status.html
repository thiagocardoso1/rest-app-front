<div class="flex-1 p-4 flex flex-col gap-4">
    <div class="rounded-lg bg-surface-100 dark:bg-surface-800 h-48">
        <div class="flex justify-center">
            <div class="flex flex-col">
                <label pLabel class="mb-2">Status</label>
                <p-autocomplete
                    [(ngModel)]="value"
                    [suggestions]="filteredItems"
                    (completeMethod)="search($event)"
                    placeholder="Search..."
                    inputStyleClass="w-full md:w-72"
                    scrollHeight="14rem"
                />
                <button pButton class="mt-4">
                    <svg data-p-icon="refresh"></svg> Update
                </button>
            </div>
        </div>
    </div>
    <div class="rounded-lg bg-surface-100 dark:bg-surface-800 flex-1"></div>
</div>
