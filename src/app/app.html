<p-sidebar-layout>
    @if (isMobile()) {
    <p-sidebar-backdrop class="absolute!" />
    }
    <p-sidebar
        id="mobile-nav"
        [collapsible]="isMobile() ? 'offcanvas' : 'icon'"
        [overlay]="isMobile()"
        [open]="!isMobile()"
        width="14rem"
    >
        <p-sidebar-spacer />
        <p-sidebar-aside>
            <p-sidebar-panel>
                <p-sidebar-header>
                    <p-sidebar-menu>
                        <p-sidebar-menu-item>
                            <button pSidebarMenuButton class="p-1!">
                                <div
                                    class="flex size-6 shrink-0 items-center justify-center rounded-md bg-linear-to-br from-cyan-700 to-blue-800 text-white text-xs font-bold leading-none"
                                >
                                    A
                                </div>
                                <span class="font-semibold text-sm"
                                    >Rest App</span
                                >
                            </button>
                        </p-sidebar-menu-item>
                    </p-sidebar-menu>
                </p-sidebar-header>
                <p-sidebar-content>
                    <p-sidebar-group>
                        <p-sidebar-group-label>Menu</p-sidebar-group-label>
                        <p-sidebar-group-content>
                            <p-sidebar-menu>
                                <p-sidebar-menu-item>
                                    <button
                                        pSidebarMenuButton
                                        [isActive]="true"
                                    >
                                        <svg data-p-icon="home"></svg>
                                        <span>Home</span>
                                    </button>
                                </p-sidebar-menu-item>
                            </p-sidebar-menu>
                        </p-sidebar-group-content>
                    </p-sidebar-group>
                </p-sidebar-content>
                <p-sidebar-footer>
                    <p-sidebar-menu>
                        <p-sidebar-menu-item>
                            <button pSidebarMenuButton class="p-1!">
                                <p-avatar
                                    label="TA"
                                    shape="circle"
                                    class="size-6 shrink-0 text-xs"
                                />
                                <span>Thigas Aurudo</span>
                            </button>
                        </p-sidebar-menu-item>
                    </p-sidebar-menu>
                </p-sidebar-footer>
            </p-sidebar-panel>
        </p-sidebar-aside>
    </p-sidebar>
    <p-sidebar-main>
        <header
            class="flex h-12 items-center gap-2 border-b border-surface-200 dark:border-surface-700 px-4"
        >
            <button
                pButton
                pSidebarTrigger
                target="mobile-nav"
                severity="secondary"
                text
                size="small"
            >
                <svg data-p-icon="sidebar"></svg>
            </button>
            <span class="text-sm font-medium">Message Node</span>
        </header>
        <div class="flex-1 p-4 flex flex-col gap-4">
            <div class="rounded-lg bg-surface-100 dark:bg-surface-800 h-48">
                <div class="flex justify-center">
                    <div class="flex flex-col">
                        <label pLabel class="mb-2">Status</label>
                        <p-autocomplete
                            [(ngModel)]="value"
                            [suggestions]="filteredItems"
                            (completeMethod)="search($event)"
                            placeholder="Search..."
                            inputStyleClass="w-full md:w-72"
                            scrollHeight="14rem"
                        />
                        <button pButton class="mt-4">
                            <svg data-p-icon="refresh"></svg> Update
                        </button>
                    </div>
                </div>
            </div>
            <div
                class="rounded-lg bg-surface-100 dark:bg-surface-800 flex-1"
            ></div>
        </div>
    </p-sidebar-main>
</p-sidebar-layout>
<router-outlet />
